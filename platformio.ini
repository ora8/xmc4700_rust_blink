; PlatformIO-Projekt: Rust-Blink für das Infineon XMC4700 Relax (Lite) Kit
; PlatformIO bringt Toolchain, Upload (J-Link on-board) und Debug mit,
; Cargo baut die eigentliche Rust-Firmware (siehe build_rust.py).
[env:kit_xmc47_relax]
platform = infineonxmc
board = kit_xmc47_relax
; kein C-Framework, die Firmware kommt komplett aus Rust
extra_scripts = pre:build_rust.py
upload_protocol = jlink
